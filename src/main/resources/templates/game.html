<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the CMC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=IM+Fell+English&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .game-image-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            background: var(--black-card);
            border: 1px solid var(--black-border);
            border-radius: 3px;
            padding: 0.75rem;
        }

        .game-image {
            max-width: 100%;
            max-height: 420px;
            object-fit: contain;
            border-radius: 3px;
            display: none;
        }

        .status-text {
            min-height: 1.3rem;
            color: var(--text-muted);
            text-align: center;
            font-size: 0.95rem;
        }

        .result-text {
            min-height: 1.3rem;
            color: var(--gold-light);
            text-align: center;
            font-size: 1rem;
        }

        .guess-input {
            width: 100%;
            background: var(--black-card);
            border: 1px solid var(--black-border);
            border-radius: 3px;
            color: var(--text-primary);
            font-family: 'IM Fell English', Georgia, serif;
            font-size: 1rem;
            padding: 0.65rem 1rem;
            transition: border-color 0.2s;
        }

        .guess-input:focus {
            outline: none;
            border-color: var(--gold-dim);
        }

        .guess-button[disabled] {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            filter: none;
        }

        .gameover-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 10, 0.75);
            z-index: 9999;
            cursor: pointer;
            padding: 1rem;
        }

        .gameover-overlay.show {
            display: flex;
        }

        .gameover-panel {
            width: min(680px, 95vw);
            max-height: 92vh;
            overflow: auto;
            background: #1d1b19;
            border: 2px solid var(--gold-dim);
            border-radius: 6px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            padding: 1rem;
            text-align: center;
        }

        .gameover-title {
            margin: 0 0 0.5rem;
            color: var(--gold-light);
        }

        .gameover-message {
            margin: 0 0 1rem;
        }

        .gameover-image {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid var(--black-border);
        }

        .gameover-hint {
            margin-top: 0.75rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>

<body>

    <div class="sigil top-left"></div>
    <div class="sigil top-right"></div>
    <div class="sigil bottom-left"></div>
    <div class="sigil bottom-right"></div>

    <main class="container">
        <header>
            <div class="title-ornament">* * *</div>
            <h1>Booster Tutor</h1>
            <div class="title-ornament">* * *</div>
        </header>

        <div class="card-panel">
            <form id="guess-form" autocomplete="off">
                <div class="field-group">
                    <label>Hidden Card</label>
                    <div class="game-image-wrap">
                        <img id="card-image" class="game-image" alt="Card without mana cost">
                        <p id="loading-text" class="status-text">Loading card...</p>
                    </div>
                </div>

                <div class="field-group">
                    <label for="cmc">Your Guess</label>
                    <input id="cmc" name="cmc" class="guess-input" type="number" step="1" min="0" inputmode="numeric"
                        required>
                </div>

                <p id="result-text" class="result-text"></p>

                <div class="submit-row">
                    <button id="guess-button" type="submit" class="go-button guess-button">
                        Guess
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div id="gameover-overlay" class="gameover-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="gameover-panel">
            <h2 class="gameover-title">Game Over</h2>
            <p id="gameover-message" class="gameover-message"></p>
            <img id="gameover-image" class="gameover-image" alt="Failed card image">
            <p class="gameover-hint">Click anywhere or press Enter to play again.</p>
        </div>
    </div>

    <script>
        (() => {
            const imageEl = document.getElementById('card-image');
            const loadingEl = document.getElementById('loading-text');
            const resultEl = document.getElementById('result-text');
            const formEl = document.getElementById('guess-form');
            const inputEl = document.getElementById('cmc');
            const buttonEl = document.getElementById('guess-button');
            const overlayEl = document.getElementById('gameover-overlay');
            const overlayMessageEl = document.getElementById('gameover-message');
            const overlayImageEl = document.getElementById('gameover-image');

            let currentObjectUrl;

            function showGameOverOverlay(message, imageSrc) {
                overlayMessageEl.textContent = message;
                overlayImageEl.src = imageSrc;
                overlayEl.classList.add('show');
                overlayEl.setAttribute('aria-hidden', 'false');
            }

            function restartGame() {
                window.location.reload();
            }

            overlayEl.addEventListener('click', restartGame);

            window.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && overlayEl.classList.contains('show')) {
                    event.preventDefault();
                    restartGame();
                }
            });

            async function fetchNoCmcImage() {
                loadingEl.textContent = 'Loading card...';
                imageEl.style.display = 'none';

                const response = await fetch('/game/getCurrentCard', {
                    method: 'GET',
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error('Failed to load card image.');
                }

                const blob = await response.blob();
                if (currentObjectUrl) {
                    URL.revokeObjectURL(currentObjectUrl);
                }
                currentObjectUrl = URL.createObjectURL(blob);
                imageEl.src = currentObjectUrl;
                imageEl.style.display = 'block';
                loadingEl.textContent = '';
            }

            async function fetchOrgImage(failedCardId) {
                loadingEl.textContent = 'Loading card...';
                imageEl.style.display = 'none';

                const response = await fetch(`/img/card?id=${failedCardId}`, {
                    method: 'GET',
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error('Failed to load card image.');
                }

                const blob = await response.blob();
                if (currentObjectUrl) {
                    URL.revokeObjectURL(currentObjectUrl);
                }
                currentObjectUrl = URL.createObjectURL(blob);
                imageEl.src = currentObjectUrl;
                imageEl.style.display = 'block';
                loadingEl.textContent = '';
            }

            async function postGuess(cmcValue) {
                const response = await fetch('/game/guessedCmc', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(cmcValue)
                });

                if (!response.ok) {
                    throw new Error('Guess request failed.');
                }

                const contentType = response.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    return response.json();
                }

                const text = await response.text();
                return { status: text, result: text };
            }

            async function init() {
                try {
                    await fetchNoCmcImage();
                } catch (err) {
                    loadingEl.textContent = err.message;
                }
            }

            formEl.addEventListener('submit', async (event) => {
                event.preventDefault();
                resultEl.textContent = '';

                const parsed = Number.parseInt(inputEl.value, 10);
                if (Number.isNaN(parsed)) {
                    resultEl.textContent = 'Enter an integer guess first.';
                    return;
                }

                buttonEl.disabled = true;

                try {
                    const { status, message, failedCardId } = await postGuess(parsed);

                    if (status === 'GAMEOVER') {
                        await fetchOrgImage(failedCardId);
                        showGameOverOverlay('Game over: ' + message, imageEl.src);
                        return;
                    }

                    if (status === 'OK') {
                        await fetchNoCmcImage();
                        resultEl.textContent = message;
                        inputEl.value = '';
                        inputEl.focus();
                        return;
                    }

                    resultEl.textContent = 'Unexpected response: ' + JSON.stringify({ status, message, failedCardId });
                } catch (err) {
                    resultEl.textContent = err.message;
                } finally {
                    buttonEl.disabled = false;
                }
            });

            window.addEventListener('beforeunload', () => {
                if (currentObjectUrl) {
                    URL.revokeObjectURL(currentObjectUrl);
                }
            });

            init();
        })();
    </script>

</body>

</html>
