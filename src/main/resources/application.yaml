spring:
  application:
    name: magme
  datasource:
    url: jdbc:h2:file:./data/mtgdb
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    properties:
      hibernate:
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 500
        generate_statistics: true
    hibernate:
      ddl-auto: update
app:
  card-images-path: ./data/img
  startup-target: CHECK_AND_POPULATE